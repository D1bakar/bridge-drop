  <title>Bridge — Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/apple.css" />
</head>
<body>
  <header class="top">
    <div class="wordmark">Bridge</div>
    <nav class="topnav" aria-label="Primary">
      <a href="/">Home</a>
      <a href="send.html">Send</a>
      <a href="history.html">History</a>
      <a href="pair.html">Pair</a>
      <a href="settings.html" aria-current="page">Settings</a>
    </nav>
  </header>
  <main>
    <h1 class="page-heading">Settings.</h1>

    <section aria-label="This device">
      <span class="pill">Device</span>
      <label class="field-label" for="set-name">Device name</label>
      <input class="field-input" id="set-name" type="text" maxlength="60" autocomplete="off" />
      <span class="field-error" id="name-error"></span>
      <br />
      <a class="action-secondary" href="#" id="name-save">Save name <span aria-hidden="true">→</span></a>
    </section>

    <section aria-label="Receiving">
      <span class="pill">Receiving</span>
      <ul class="settings-list" id="toggle-list"></ul>
      <p class="recent-meta" id="save-root"></p>
    </section>

    <section aria-label="Glass clarity">
      <span class="pill">Glass</span>
      <label class="field-label" for="clarity">Clarity — ultra-clear to frosted</label>
      <input class="clarity-range" id="clarity" type="range" min="0" max="100" step="1" value="8" />
      <span class="recent-meta" id="clarity-value">Ultra-clear</span>
    </section>

    <section aria-label="Save rules">
      <span class="pill">Rules</span>
      <ul class="settings-list" id="rules-list"></ul>
      <label class="field-label" for="rule-ext">File extension, like .mp4</label>
      <input class="field-input" id="rule-ext" type="text" maxlength="12" autocomplete="off" placeholder=".mp4" />
      <label class="field-label" for="rule-dir">Lands in folder</label>
      <input class="field-input" id="rule-dir" type="text" maxlength="60" autocomplete="off" placeholder="Videos" />
      <span class="field-error" id="rule-error"></span>
      <br />
      <a class="action-secondary" href="#" id="rule-add">Add rule <span aria-hidden="true">→</span></a>
    </section>
  </main>
  <nav class="tabbar" aria-label="Primary">
    <a href="/"><svg class="tab-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12 12 4.5 19.5 12"/><path d="M6.5 10.5V20h11v-9.5"/></svg>Home</a>
    <a href="send.html"><svg class="tab-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V4.5"/><path d="M5.5 11 12 4.5 18.5 11"/></svg>Send</a>
    <a href="history.html"><svg class="tab-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7.5"/><path d="M12 8.5V12l2.5 2"/></svg>History</a>
    <a href="pair.html"><svg class="tab-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/></svg>Pair</a>
    <a href="settings.html" aria-current="page"><svg class="tab-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h2.5M11.5 8H20M4 16h8.5M17.5 16H20"/><circle cx="9" cy="8" r="2.3"/><circle cx="15" cy="16" r="2.3"/></svg>Settings</a>
  </nav>
  <script src="js/api.js"></script>
  <script src="js/settings-page.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/tabbar.js"></script>
  <script src="js/clarity.js"></script>
</body>
</html>
