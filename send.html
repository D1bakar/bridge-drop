<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ececec" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/bridge-192.png" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23ececec'/%3E%3Cg stroke='%23262523' stroke-width='10' stroke-linecap='round'%3E%3Cline x1='50' y1='22' x2='50' y2='78'/%3E%3Cline x1='26' y1='36' x2='74' y2='64'/%3E%3Cline x1='74' y1='36' x2='26' y2='64'/%3E%3C/g%3E%3C/svg%3E" />
  <title>Bridge — Send</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <header class="top">
    <div class="wordmark">Bridge</div>
    <nav class="topnav" aria-label="Primary">
      <a href="/">Home</a>
      <a href="send.html" aria-current="page">Send</a>
      <a href="history.html">History</a>
      <a href="pair.html">Pair</a>
      <a href="settings.html">Settings</a>
    </nav>
  </header>
  <main>
    <h1 class="page-heading">Send.</h1>

    <section class="transfer" aria-label="Batch progress">
      <span class="transfer-pct" id="batch-pct"></span>
      <div class="transfer-line"><div class="transfer-fill" id="batch-fill"></div></div>
    </section>

    <section class="dropzone" id="batch-drop" aria-label="Drop files or folders">
      <span class="dropzone-label">Drop files or a folder here</span>
      <label class="action-secondary" for="batch-input" tabindex="0">Choose files <span aria-hidden="true">→</span></label>
      <input class="file-input" id="batch-input" type="file" multiple />
      <label class="action-secondary" for="folder-input" tabindex="0">Choose folder <span aria-hidden="true">→</span></label>
      <input class="file-input" id="folder-input" type="file" webkitdirectory />
    </section>

    <ul class="batch-list" id="batch-list"></ul>
  </main>
  <script src="js/api.js"></script>
  <script src="js/batch.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
