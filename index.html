<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ececec" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/bridge-192.png" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23ececec'/%3E%3Cg stroke='%23262523' stroke-width='10' stroke-linecap='round'%3E%3Cline x1='50' y1='22' x2='50' y2='78'/%3E%3Cline x1='26' y1='36' x2='74' y2='64'/%3E%3Cline x1='74' y1='36' x2='26' y2='64'/%3E%3C/g%3E%3C/svg%3E" />
  <title>Bridge — Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/apple.css" />
</head>
<body>
  <header class="top">
    <div class="wordmark">Bridge</div>
    <nav class="topnav" aria-label="Primary">
      <a href="/" aria-current="page">Home</a>
      <a href="send.html">Send</a>
      <a href="history.html">History</a>
      <a href="pair.html">Pair</a>
      <a href="settings.html">Settings</a>
    </nav>
  </header>
  <main id="home">
    <p class="eyebrow" id="net-status" aria-live="polite">Checking…</p>
    <h1 class="monument">Drop<br />here.</h1>

    <!-- Transfer field: the spatial hero. IDs kept for js/dropzone.js + js/upload.js. -->
    <section class="field" id="dropzone" aria-label="Transfer field">
      <svg class="bridge-mark" viewBox="0 0 120 120" aria-hidden="true" focusable="false"><g stroke="currentColor" stroke-width="5" stroke-linecap="round" fill="none"><circle cx="60" cy="26" r="10" /><circle cx="60" cy="94" r="10" /><line x1="60" y1="36" x2="60" y2="84" /></g><g class="bridge-pulse" stroke="currentColor" stroke-width="5" stroke-linecap="round" fill="none"><circle cx="60" cy="60" r="4" /></g></svg>
      <span class="dropzone-label" aria-live="polite">Drop files here</span>
      <label class="action-secondary" for="file-input" tabindex="0">Choose files <span aria-hidden="true">→</span></label>
      <input class="file-input" id="file-input" type="file" />
    </section>
    <a class="action-primary" href="send.html">Send <span aria-hidden="true">→</span></a>

    <section class="devices-section" aria-label="Devices">
      <span class="pill">Paired</span>
      <ul class="devices" id="devices-list">
        <li class="device is-selected">
          <div class="device-main">
            <span class="device-meta">Windows · LAN</span>
            <span class="device-name">My PC <span aria-hidden="true">→</span></span>
          </div>
          <span class="pill">Paired</span>
        </li>
      </ul>
      <a class="action-secondary" href="pair.html">Pair a phone <span aria-hidden="true">→</span></a>
    </section>

    <section aria-label="Share text">
      <span class="pill">Text</span>
      <form class="snippet-form">
        <label class="field-label" for="snippet-input">Paste text or a link</label>
        <textarea class="field-area" id="snippet-input" rows="1"></textarea>
        <span class="field-error"></span>
        <br />
        <button class="action-secondary" type="submit" style="background:none;border:none;padding:0;cursor:pointer;font:inherit;color:inherit;">Share text <span aria-hidden="true">→</span></button>
      </form>
    </section>

    <section class="recent" id="recent" aria-label="Recent transfers">
      <span class="pill">Recent</span>
      <ul class="recent-list" id="recent-list">
        <li class="recent-row">
          <div class="recent-main">
            <span class="recent-name">IMG_2041.jpg</span>
            <span class="recent-meta">Today 12:40 · 24.2 MB</span>
          </div>
          <span class="pill">In</span>
        </li>
        <li class="recent-row">
          <div class="recent-main">
            <span class="recent-name">notes.txt</span>
            <span class="recent-meta">Today 09:12 · 2 KB</span>
          </div>
          <span class="pill">Out</span>
        </li>
      </ul>
      <a class="action-secondary" href="history.html">View all <span aria-hidden="true">→</span></a>
    </section>
  </main>
  <nav class="tabbar" aria-label="Primary">
    <a href="/" aria-current="page">Home</a>
    <a href="send.html">Send</a>
    <a href="history.html">History</a>
    <a href="pair.html">Pair</a>
    <a href="settings.html">Settings</a>
  </nav>
  <script src="js/api.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/dropzone.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/feed.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/tabbar.js"></script>
  <script src="js/clarity.js"></script>
</body>
</html>
