<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ececec" />
  <title>Bridge — Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <header class="top">
    <div class="wordmark">Bridge</div>
    <nav class="topnav" aria-label="Primary">
      <a href="/" aria-current="page">Home</a>
      <a href="send.html">Send</a>
      <a href="history.html">History</a>
      <a href="pair.html">Pair</a>
      <a href="settings.html">Settings</a>
    </nav>
  </header>
  <main id="home">
    <h1 class="monument">Drop<br />here.</h1>
    <a class="action-primary" href="send.html">Send <span aria-hidden="true">→</span></a>

    <!-- .is-dragover toggled by js/dropzone.js; picker wired by js/upload.js -->
    <section class="dropzone" id="dropzone" aria-label="Drop files">
      <span class="dropzone-label">Drop files here</span>
      <label class="action-secondary" for="file-input" tabindex="0">Choose files <span aria-hidden="true">→</span></label>
      <input class="file-input" id="file-input" type="file" />
    </section>

    <section class="devices-section" aria-label="Devices">
      <span class="pill">Paired</span>
      <ul class="devices" id="devices-list">
        <li class="device is-selected">
          <div class="device-main">
            <span class="device-meta">Windows · LAN</span>
            <span class="device-name">My PC <span aria-hidden="true">→</span></span>
          </div>
          <span class="pill">Paired</span>
        </li>
      </ul>
      <a class="action-secondary" href="pair.html">Pair a phone <span aria-hidden="true">→</span></a>
    </section>

    <section aria-label="Share text">
      <span class="pill">Text</span>
      <form class="snippet-form">
        <label class="field-label" for="snippet-input">Paste text or a link</label>
        <textarea class="field-area" id="snippet-input" rows="2"></textarea>
        <span class="field-error"></span>
        <br />
        <button class="action-secondary" type="submit" style="background:none;border:none;padding:0;cursor:pointer;font:inherit;color:inherit;">Share text <span aria-hidden="true">→</span></button>
      </form>
    </section>

    <section class="recent" id="recent" aria-label="Recent transfers">
      <span class="pill">Recent</span>
      <span class="pill" id="net-status">Checking…</span>
      <ul class="recent-list" id="recent-list">
        <li class="recent-row">
          <div class="recent-main">
            <span class="recent-name">IMG_2041.jpg</span>
            <span class="recent-meta">Today 12:40 · 24.2 MB</span>
          </div>
          <span class="pill">In</span>
        </li>
        <li class="recent-row">
          <div class="recent-main">
            <span class="recent-name">notes.txt</span>
            <span class="recent-meta">Today 09:12 · 2 KB</span>
          </div>
          <span class="pill">Out</span>
        </li>
      </ul>
      <a class="action-secondary" href="history.html">View all <span aria-hidden="true">→</span></a>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/dropzone.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/feed.js"></script>
</body>
</html>
